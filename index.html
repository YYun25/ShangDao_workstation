  <title>上統工作站</title>
  <style>
    :root { --brand: #087f83; --brand-dark: #07666b; --green: #69a84f; }
    * { box-sizing: border-box; }
    body { font-family: Arial, "Noto Sans TC", sans-serif; background: #f2f8f7; margin: 0; padding: 32px 24px 60px; text-align: center; color: #214448; }
    h1 { color: var(--brand-dark); margin: 0 0 12px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
    body > p { margin: 0; color: #617c7e; font-size: 16px; }
    .buttons { max-width: 800px; margin: 36px auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .buttons button { display: flex; align-items: center; gap: 16px; min-height: 100px; padding: 22px; border: 1px solid #d8e7e4; border-radius: 18px; background: #fff; color: var(--brand-dark); font: 600 17px/1.45 Arial, "Noto Sans TC", sans-serif; text-align: left; cursor: pointer; box-shadow: 0 4px 16px #163f4205; transition: transform .18s, box-shadow .18s, border-color .18s; }
    .buttons button::before { content: attr(data-icon); display: grid; place-items: center; flex: 0 0 44px; height: 44px; border-radius: 12px; background: #eaf5f2; color: var(--brand); font-size: 20px; }
    .buttons button::after { content: '↗'; margin-left: auto; color: #89a6a3; font-weight: 400; }
    .buttons button:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: 0 8px 24px #163f4212; }
    .buttons button:focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }
    @media (max-width: 580px) { body { padding: 24px 16px 40px; } .buttons { grid-template-columns: 1fr; gap: 12px; margin-top: 28px; } .buttons button { min-height: 84px; padding: 18px; } }
  </style>
  <link rel="stylesheet" href="assets/language.css">
  <script src="assets/translations.js" defer></script>
  <script src="assets/language.js" defer></script>
</head>
